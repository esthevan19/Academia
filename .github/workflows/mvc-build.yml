name: MVC build validation

on:
  push:
    branches:
      - main
      - feature/gymflow-mobile-api
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore tests/GymFlow.SecurityContracts/GymFlow.SecurityContracts.csproj
      - name: Build
        run: dotnet build GymManagementPL/GymManagementPL.csproj --no-restore --configuration Release
      - name: Authorization regression tests
        run: dotnet run --project tests/GymFlow.SecurityContracts/GymFlow.SecurityContracts.csproj --no-restore --configuration Release
